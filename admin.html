<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f5"><title>관리자 페이지 · QR TICKET</title><link rel="stylesheet" href="styles.css"><style>
.admin-card{background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #00000008}.admin-card h2{margin:0 0 14px;font-size:18px}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#f5f5f5;border-radius:12px;padding:14px}.metric b{display:block;font-size:25px}.metric span{font-size:12px;color:#737373}.admin-table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee}th{color:#666;background:#fafafa}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.status-pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#eee}.status-ok{background:#e7f7ec;color:#176b35}.status-bad{background:#fff0ef;color:#a12b25}
</style></head><body><header class="topbar"><div class="brand-mark">Q</div><div><strong>QR TICKET</strong><small>관리자 전용</small></div></header><main class="mobile-shell"><section class="hero"><p class="eyebrow">ADMIN CONSOLE</p><h1>관리자 대시보드</h1><p>관리자 계정으로 로그인해 사용자와 티켓 현황을 확인하세요.</p></section>
<section class="admin-card" id="login-panel"><h2 id="auth-title">관리자 로그인</h2><div id="login-fields"><label for="username">아이디</label><input id="username" autocomplete="username" autocapitalize="none" maxlength="24" placeholder="관리자 아이디"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"></div><div class="button-row"><button id="login" class="button primary full">로그인</button></div><p id="message" class="message" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="admin-card"><div class="admin-actions" style="justify-content:space-between;align-items:center"><h2>전체 현황</h2></div><div class="admin-grid"><div class="metric"><b id="users-count">-</b><span>가입 사용자</span></div><div class="metric"><b id="tickets-count">-</b><span>전체 티켓</span></div><div class="metric"><b id="active-count">-</b><span>유효 티켓</span></div><div class="metric"><b id="used-count">-</b><span>사용 완료</span></div></div><div class="admin-actions" style="margin-top:14px"><button id="refresh" class="button primary">새로고침</button></div></div>
<div class="admin-card"><h2>사용자 목록</h2><div class="admin-table-wrap"><table><thead><tr><th>아이디</th><th>권한</th><th>가입일</th></tr></thead><tbody id="users-body"></tbody></table></div></div>
<div class="admin-card"><h2>티켓 목록</h2><div class="admin-table-wrap"><table><thead><tr><th>사용자</th><th>발급 시각</th><th>만료 시각</th><th>상태</th></tr></thead><tbody id="tickets-body"></tbody></table></div></div></section><footer>QR TICKET · ADMIN</footer></main><script type="module" src="admin.js"></script></body></html>
