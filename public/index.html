<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5"><title>모바일 QR 티켓</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div class="brand-mark">Q</div><div><strong>QR TICKET</strong><small>모바일 입장권</small></div></header>
<main class="mobile-shell">
  <section class="hero"><p class="eyebrow">YOUR EVENT PASS</p><h1>행사 입장권</h1><p>로그인하고 모바일 티켓을 발급받으세요.</p></section>
  <section class="card" id="auth-card">
    <h2>내 계정</h2>
    <label for="username">아이디</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" placeholder="영문 소문자·숫자·_ - (3~24자)">
    <label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="6자 이상">
    <div class="button-row"><button id="signup" class="button primary">회원가입</button><button id="login" class="button secondary">로그인</button></div>
    <button id="logout" class="button text-button" hidden>로그아웃</button>
    <p id="account" class="subtle">로그인하지 않았습니다.</p>
  </section>
  <section class="ticket-card">
    <div class="ticket-heading"><div><p class="eyebrow">DIGITAL PASS</p><h2>내 모바일 티켓</h2></div><span class="live-pill">QR PASS</span></div>
    <p class="subtle">입장 직전에 발급해 주세요. 티켓은 60초 동안 유효합니다.</p>
    <button id="issue" class="button primary full" disabled>QR 티켓 발급하기</button>
    <div id="ticket" class="qr-wrap"><div class="qr-placeholder">로그인 후<br>티켓을 발급해 주세요</div></div>
    <p id="ticket-status" class="ticket-status">발급된 티켓이 없습니다.</p>
  </section>
  <section class="card"><div class="section-head"><h2>최근 발급 내역</h2><button id="refresh" class="small-button" disabled>새로고침</button></div><div id="history" class="history-list"><p class="subtle">로그인하면 발급 내역을 확인할 수 있습니다.</p></div></section>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <footer>QR TICKET · 모바일 웹</footer>
</main>
<script type="module" src="ticket.js"></script>
</body></html>
