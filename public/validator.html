<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입장 확인</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="wrap">
<h1>입장 확인 시스템</h1><section class="panel">
<h2>검표원 로그인</h2>
<label>이메일<input id="email" type="email" autocomplete="username"></label>
<label>비밀번호<input id="password" type="password" autocomplete="current-password"></label>
<div class="actions"><button id="login">로그인</button><button id="logout" class="secondary" hidden>로그아웃</button></div>
<p id="account" class="muted">로그인하지 않았습니다.</p>
</section>
<section class="panel"><h2>QR 코드 스캔</h2><button id="start">카메라 시작</button><button id="stop" class="secondary">카메라 중지</button><div id="reader"></div><div id="result" class="message"></div></section>
</main>
<script src="https://unpkg.com/html5-qrcode"></script><script type="module" src="validator.js"></script></body></html>
